# Render Blueprint: public HTTPS FastAPI service + PostgreSQL.
# Free Postgres is suitable for short prototypes, but Render deletes it 30 days
# after creation unless upgraded. Upgrade the database before that date to keep data.
services:
  - type: web
    name: proxyproof-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: proxyproof-postgres
          property: connectionString
      - key: PROXYPROOF_TOKEN_SECRET
        generateValue: true
      - key: PROXYPROOF_ORGANISER_INVITE_CODE
        sync: false

databases:
  - name: proxyproof-postgres
    databaseName: proxyproof
    user: proxyproof
    plan: free
    region: singapore
